<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://accounts.google.com https://apis.google.com https://cdn.jsdelivr.net;
      connect-src 'self' https://accounts.google.com https://*.googleapis.com https://kroki.io https://mermaid.ink https://www.plantuml.com;
      style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
      img-src 'self' data: blob: https://kroki.io https://mermaid.ink https://www.plantuml.com;
      font-src 'self' https://cdn.jsdelivr.net;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
    " />
    <meta name="description" content="A VSCode-like H5 markdown editor for Google Drive with diagram support (Mermaid, Kroki, PlantUML)" />
    <meta property="og:title" content="Markdown Studio — Markdown Editor for Google Drive" />
    <meta property="og:description" content="Edit and preview markdown files in Google Drive with full diagram support." />
    <title>Markdown Studio</title>
    <!-- KaTeX CSS for math rendering -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+"
      crossorigin="anonymous"
    />
    <!-- Highlight.js theme for code blocks in preview -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css"
      integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
